name: 방문·다운로드 통계 수집

on:
  schedule:
    - cron: '30 15 * * *' # 매일 00:30 KST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stats
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: main

      # 통계는 main 이 아닌 stats 브랜치에 쌓는다 (README·릴리스 기록을 건드리지 않도록)
      - name: stats 브랜치 준비
        run: |
          if git ls-remote --exit-code --heads "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" stats >/dev/null; then
            git clone --depth 1 --branch stats "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" data
          else
            mkdir data && cd data && git init -q -b stats
            git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 수집
        run: node main/.github/scripts/collect-stats.mjs data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TRAFFIC_TOKEN: ${{ secrets.TRAFFIC_TOKEN }}

      - name: 저장
        working-directory: data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "변경 없음"
            exit 0
          fi
          git commit -q -m "chore(stats): $(date -u +%F) 통계"
          git push origin stats
